<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siga Duda Sá em todas as redes socias!!</title>
    <!-- Font Awesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-color: #ffffff;
            --subtext-color: #aaaaaa;
            --primary-color: #a29bfe;
            --button-bg: #1e1e1e;
            --button-hover-bg: #2d2d2d;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .linktree-container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            text-align: center;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin: 20px;
            border: 1px solid #222;
        }

        .profile-container {
            margin-bottom: 25px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 15px rgba(162, 155, 254, 0.4);
        }

        .profile-title {
            font-size: 22px;
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 10px;
            color: var(--text-color);
            line-height: 1.3;
        }

        .profile-username {
            font-size: 14px;
            color: var(--subtext-color);
            margin-bottom: 12px;
        }

        .contact-email {
            font-size: 13px;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-weight: 500;
        }

        .contact-email a {
            color: inherit;
            text-decoration: none;
        }

        .contact-email a:hover {
            text-decoration: underline;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 20px;
            background-color: var(--button-bg);
            color: var(--text-color);
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            border: 1px solid #333;
        }

        .link-button:hover {
            background-color: var(--button-hover-bg);
            transform: translateY(-3px);
            border-color: var(--primary-color);
            box-shadow: 0 5px 15px rgba(162, 155, 254, 0.2);
        }

        .link-button i, .link-button .kick-icon-wrap {
            font-size: 22px;
            margin-right: 15px;
            width: 30px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cores dos Ícones */
        .link-button i.fa-twitch { color: #9146FF; }
        .link-button i.fa-youtube { color: #FF0000; }
        .link-button i.fa-tiktok { color: #25F4EE; }
        .link-button i.fa-instagram { color: #E4405F; }
        .link-button i.fa-spotify { color: #1DB954; }

        /* Ícone Oficial Kick */
        .kick-svg {
            width: 20px;
            height: 20px;
            fill: #53FC18;
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="linktree-container">
        <!-- Perfil -->
        <div class="profile-container">
            <img src="https://cdn.discordapp.com/attachments/1312157796476784683/1559935780439203840/WhatsApp_Image_2026-10-14_at_11.09.45_AM.jpeg?ex=6ad0e2e8&is=6acf9168&hm=11004bae47661b7a24ece15a2c687b1e59e16b15f9af551f9caf8defc42aff05" alt="Foto de Perfil de Duda Sá" class="profile-pic">
            <h1 class="profile-title">Siga Duda Sá em todasz as redes socias!!</h1>
            <p class="profile-username">@_duda.sa_ / adudasaa / prodbyduda</p>
            <p class="contact-email">email para contato profissional: <a href="mailto:dudasa.contato@gmail.com">dudasa.contato@gmail.com</a></p>
        </div>

        <!-- Links na Ordem Solicitada -->
        <div class="links-container">
            <!-- 1. Twitch -->
            <a href="https://twitch.tv/adudasaa" class="link-button" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-twitch"></i>
                Twitch
            </a>

            <!-- 2. Kick -->
            <a href="https://kick.com/adudasaa" class="link-button" target="_blank" rel="noopener noreferrer">
                <span class="kick-icon-wrap">
                    <svg class="kick-svg" viewBox="0 0 24 24">
                        <path d="M3 3h5v6h2.5L14 3h7l-6.5 8.5L21 21h-7l-3.5-6H8v6H3V3z"/>
                    </svg>
                </span>
                Kick
            </a>

            <!-- 3. YouTube -->
            <a href="https://www.youtube.com/@prodbyduda" class="link-button" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-youtube"></i>
                YouTube
            </a>

            <!-- 4. TikTok -->
            <a href="https://www.tiktok.com/@_duda.sa_?lang=pt-BR" class="link-button" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-tiktok"></i>
                TikTok
            </a>

            <!-- 5. Instagram -->
            <a href="https://www.instagram.com/_duda.sa_/" class="link-button" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-instagram"></i>
                Instagram
            </a>

            <!-- 6. Spotify -->
            <a href="https://open.spotify.com/intl-pt/artist/3Tmjo7uHyqcklk5p38IEn7" class="link-button" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-spotify"></i>
                Spotify
            </a>
        </div>

        <div class="footer">
            <p>Feito para Duda Sá ❤️</p>
        </div>
    </div>

</body>
</html>
